# Directus + Postgres pour M42.guide (développement local).
# Lancement : cp .env.example .env (puis renseigner les secrets) et `docker compose up -d`.
# Interface d'administration : http://localhost:8055

name: m42-cms

services:
  database:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Postgres 18 : monter le dossier parent, l'image range les données par version.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:12.7.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '${DIRECTUS_PORT:-8055}:8055'
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    environment:
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Compte administrateur créé au premier démarrage (Paul).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Clé « Open Innovation Grant » (facultative en local ; sans clé : 3 comptes, 25 collections, 5 flows).
      LICENSE_KEY: ${LICENSE_KEY:-}

      # Aucune télémétrie envoyée à l'éditeur.
      TELEMETRY: 'false'

      # Le site statique (dev Astro) lira l'API au moment du build ; CORS limité aux origines connues.
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Limite de débit par adresse IP (formulaires publics compris).
      RATE_LIMITER_ENABLED: 'true'
      RATE_LIMITER_STORE: memory
      RATE_LIMITER_POINTS: ${RATE_LIMITER_POINTS:-600}
      RATE_LIMITER_DURATION: ${RATE_LIMITER_DURATION:-60}

      # E-mails (notifications des formulaires, confirmation de la lettre).
      # En local : Mailpit (http://localhost:8025), rien ne part vraiment.
      EMAIL_FROM: ${EMAIL_FROM:-bonjour@m42.guide}
      EMAIL_TRANSPORT: smtp
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      EMAIL_SMTP_IGNORE_TLS: ${EMAIL_SMTP_IGNORE_TLS:-true}

      # Adresse du site, lue par les flows (lien de confirmation de la lettre).
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      # Aperçu du site à côté du formulaire (Live Preview) : adresse autorisée dans l'interface.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: ${APERCU_FRAME_SRC:-array:'self',http://localhost:4321}

      # Publication automatique (flow « Site : publication ») : vides en local, rien n'est appelé.
      COOLIFY_DEPLOY_URL: ${COOLIFY_DEPLOY_URL:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}
      FLOWS_ENV_ALLOW_LIST: SITE_URL,COOLIFY_DEPLOY_URL,COOLIFY_TOKEN

  # Boîte de réception de test (développement local uniquement).
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
